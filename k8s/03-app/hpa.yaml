apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-api
  namespace: car-repair-shop-execution
  labels:
    app.kubernetes.io/part-of: fiap-tech-challenge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-api
  minReplicas: 2
  # The cluster is shared with the OS and Execution services: two t3.large
  # give about 2260m requestable CPU. Four execution replicas at 100m leave room
  # for the OS at its maximum and a 25% surge during rollouts.
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
