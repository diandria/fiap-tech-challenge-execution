sonar.organization=diandria
sonar.projectKey=diandria_fiap-tech-challenge-execution
sonar.projectName=Execution Service

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Reuses the lcov from `npm run test:coverage` instead of recomputing.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without these, Sonar analyses `dist/` and reports every issue twice.
sonar.exclusions=dist/**,coverage/**,node_modules/**

# The files jest leaves out of coverage on purpose (wiring, Swagger, clients
# that only exist against real infrastructure). Without the same list here,
# any pull request touching them would fail the gate's coverage on new code.
sonar.coverage.exclusions=src/main.ts,src/app.ts,src/frameworks/http/swagger/**,src/frameworks/database/dynamoClient.ts,src/frameworks/tracing/start.ts

# The scanner waits for the quality gate and fails when it fails.
sonar.qualitygate.wait=true
