name: Infra destroy

# Manual only, with a typed confirmation: hard to trigger by accident, easy on
# purpose.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm the destruction'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-execution
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.6"
  AWS_REGION: us-east-1

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    name: Destroy infrastructure
    if: inputs.confirm == 'production'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Verify credentials
        run: |
          aws ec2 describe-vpcs --max-items 1 > /dev/null 2>&1 || {
            echo "::error::AWS credentials missing, expired or revoked. Start the lab and update the AWS_* repository secrets."
            exit 1
          }

      - name: terraform init
        run: terraform init -input=false

      - name: terraform destroy
        run: terraform destroy -auto-approve -input=false -no-color

  rejected:
    name: Invalid confirmation
    if: inputs.confirm != 'production'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Invalid confirmation. Type exactly 'production' to destroy."
          exit 1
